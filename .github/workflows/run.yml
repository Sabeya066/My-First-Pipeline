name: Remote Maven Pipeline

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # This installs Google Chrome and Chromedriver automatically on the remote machine
    - name: Setup Chrome for Selenium
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Build and Run Application from Test Folder
      run: mvn test-compile exec:java -Dexec.mainClass="org.tcs.java.excel.ExcelProject" -Dexec.classpathScope="test"
