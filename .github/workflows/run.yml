name: Remote Maven Pipeline

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # This adds a manual "Run" button just in case

jobs:
  run-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Let's test if the project builds first without breaking on the main class path
    - name: Build and Run Application
      run: mvn clean compile exec:java -Dexec.mainClass="org.tcs.java.excel.ExcelProject"
